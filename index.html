<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Aura - Meditation</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color-1: #070913;
            --bg-color-2: #161224;
            --bg-color-3: #0f172a;
            --glow-color: rgba(94, 234, 212, 0.6);
            --glow-color-intense: rgba(45, 212, 191, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: linear-gradient(45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            width: 100%;
            padding: 2rem;
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--text-sub);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .tech-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .tech-btn:hover {
            color: var(--text-main);
        }

        .tech-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        .meditation-core {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .aura-container {
            position: absolute;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aura-layer-1, .aura-layer-2, .aura-layer-3 {
            position: absolute;
            border-radius: 50%;
            transition-property: transform, box-shadow, background;
            /* JS에서 duration을 동적으로 제어함 */
        }

        .aura-layer-1 {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            opacity: 0.3;
        }

        .aura-layer-2 {
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, var(--glow-color-intense) 0%, transparent 70%);
            box-shadow: 0 0 40px var(--glow-color);
            opacity: 0.5;
        }

        .aura-layer-3 {
            width: 40%;
            height: 40%;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
        }

        .text-display {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }

        .phase-text {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease;
        }

        .timer-text {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
        }

        .timeline-container {
            display: flex;
            gap: 1rem;
            margin-top: 3rem;
            z-index: 10;
        }

        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            position: relative;
        }

        .timeline-dot.active {
            background: var(--glow-color-intense);
            box-shadow: 0 0 15px var(--glow-color-intense);
            transform: scale(1.3);
        }

        .controls {
            padding: 3rem;
            z-index: 10;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(94, 234, 212, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>AURA BREATHE</h1>
        <div class="glass-panel">
            <button class="tech-btn active" data-tech="box">박스 호흡</button>
            <button class="tech-btn" data-tech="sleep">숙면 호흡</button>
            <button class="tech-btn" data-tech="energy">에너지 호흡</button>
        </div>
    </header>

    <main class="meditation-core">
        <div class="aura-container">
            <div class="aura-layer-1" id="aura1"></div>
            <div class="aura-layer-2" id="aura2"></div>
            <div class="aura-layer-3" id="aura3"></div>
        </div>
        
        <div class="text-display">
            <div class="phase-text" id="phaseText">준비</div>
            <div class="timer-text" id="timerText">00:00</div>
        </div>

        <div class="timeline-container" id="timeline">
            <!-- JS로 동적 생성됨 -->
        </div>
    </main>

    <div class="controls">
        <button class="play-btn" id="playBtn" aria-label="시작/정지">
            <i class="fas fa-play" style="margin-left: 4px;"></i>
        </button>
    </div>

    <script>
        // 호흡법 데이터 정의 (이름, 각 페이즈의 이름, 시간(초), 애니메이션 스케일)
        const breathTechniques = {
            box: {
                phases: [
                    { name: '들숨', duration: 4, scale: 1.8 },
                    { name: '멈춤', duration: 4, scale: 1.8 },
                    { name: '날숨', duration: 4, scale: 0.6 },
                    { name: '멈춤', duration: 4, scale: 0.6 }
                ]
            },
            sleep: {
                phases: [
                    { name: '들숨', duration: 4, scale: 1.8 },
                    { name: '멈춤', duration: 7, scale: 1.8 },
                    { name: '날숨', duration: 8, scale: 0.5 }
                ]
            },
            energy: {
                phases: [
                    { name: '들숨', duration: 6, scale: 2.0 },
                    { name: '날숨', duration: 2, scale: 0.7 }
                ]
            }
        };

        // DOM 요소 선언
        const techBtns = document.querySelectorAll('.tech-btn');
        const phaseText = document.getElementById('phaseText');
        const timerText = document.getElementById('timerText');
        const timeline = document.getElementById('timeline');
        const playBtn = document.getElementById('playBtn');
        const auraLayers = [
            document.getElementById('aura1'),
            document.getElementById('aura2'),
            document.getElementById('aura3')
        ];

        // 상태 변수
        let currentTech = 'box';
        let isPlaying = false;
        let phaseIndex = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let currentPhases = breathTechniques[currentTech].phases;

        // 타임라인 점 동적 렌더링
        function renderTimeline() {
            timeline.innerHTML = '';
            currentPhases.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'timeline-dot';
                if (index === phaseIndex && isPlaying) dot.classList.add('active');
                timeline.appendChild(dot);
            });
        }

        // 호흡법 변경 처리
        techBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(isPlaying) stopBreathing(); // 실행 중이면 정지
                
                techBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentTech = e.target.dataset.tech;
                currentPhases = breathTechniques[currentTech].phases;
                
                resetUI();
            });
        });

        function resetUI() {
            phaseIndex = 0;
            phaseText.textContent = '준비';
            timerText.textContent = '00:00';
            renderTimeline();
            
            // 애니메이션 초기화 (부드럽게 복귀)
            auraLayers.forEach(layer => {
                layer.style.transition = 'transform 1s ease-in-out';
                layer.style.transform = 'scale(1)';
            });
        }

        // 특정 페이즈의 애니메이션과 UI 적용
        function applyPhase() {
            const phase = currentPhases[phaseIndex];
            timeLeft = phase.duration;
            
            phaseText.textContent = phase.name;
            updateTimerDisplay();

            // 타임라인 활성화 업데이트
            const dots = document.querySelectorAll('.timeline-dot');
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === phaseIndex);
            });

            // CSS Transition 시간을 현재 페이즈 시간에 맞춰 동적 변경 후 크기 조절
            auraLayers.forEach((layer, idx) => {
                // 레이어마다 약간의 딜레이/차이를 주어 유기적인 움직임 연출
                const ease = phase.name === '멈춤' ? 'linear' : 'ease-in-out';
                layer.style.transition = `transform ${phase.duration}s ${ease}, opacity ${phase.duration}s ease`;
                
                // 각 레이어별 미세한 스케일 차이 적용
                const scaleModifier = 1 - (idx * 0.1); 
                layer.style.transform = `scale(${phase.scale * scaleModifier})`;
            });
        }

        function updateTimerDisplay() {
            const seconds = Math.ceil(timeLeft);
            timerText.textContent = `00:0${seconds}`;
        }

        function startBreathing() {
            if(!isPlaying) return;
            
            applyPhase(); // 첫 페이즈 시작
            
            const tick = 100; // 0.1초 단위 갱신으로 부드러운 시간차 계산
            timerInterval = setInterval(() => {
                timeLeft -= (tick / 1000);
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    phaseIndex = (phaseIndex + 1) % currentPhases.length;
                    applyPhase();
                }
            }, tick);
        }

        function stopBreathing() {
            isPlaying = false;
            clearInterval(timerInterval);
            playBtn.innerHTML = '<i class="fas fa-play" style="margin-left: 4px;"></i>';
            resetUI();
        }

        // 재생/정지 버튼 이벤트
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopBreathing();
            } else {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-stop"></i>';
                phaseIndex = 0; // 시작 시 항상 처음부터
                startBreathing();
            }
        });

        // 초기 렌더링
        resetUI();
    </script>
</body>
</html>
